name: CI

# Day-to-day PRs (into develop) run on macOS only — fast. Anything going to main
# (PRs into main, pushes to main) runs the full macOS + Linux + Windows matrix.
on:
  push:
    branches: [main, develop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["macos-14","ubuntu-24.04","windows-2022"]' || '["macos-14"]') }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Only long-lived branches save the cache, so PRs start from a warm develop/main cache.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Performance (release)
        if: runner.os == 'macOS' && (github.base_ref == 'main' || github.ref == 'refs/heads/main')
        run: cargo test --release --test perf -- --ignored --nocapture
