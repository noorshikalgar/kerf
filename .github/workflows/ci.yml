name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS", os: macos-14 }
          - { name: "Linux", os: ubuntu-24.04 }
          - { name: "Windows", os: windows-2022 }
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Performance (release)
        if: runner.os == 'macOS'
        run: cargo test --release --test perf -- --ignored --nocapture
