name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to build and publish binaries for
# macOS (universal), Linux (x86_64) and Windows (x86_64). workflow_dispatch builds artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS universal", os: macos-14, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: "Linux x86_64", os: ubuntu-24.04, targets: "" }
          - { name: "Windows x86_64", os: windows-2022, targets: "" }
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v${version}"; exit 1; }

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ pkg-config libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev libzstd-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: scripts/bundle-macos.sh universal

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: scripts/bundle-linux.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bundle-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: kerf-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum Kerf-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kerf-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download `Kerf-*-macos-universal.zip`, unzip, move **Kerf.app** to Applications.
            Ad-hoc signed (not notarized): first launch right-click → **Open**, or
            `xattr -dr com.apple.quarantine /Applications/Kerf.app`

            **Linux (experimental)** — download `Kerf-*-linux-x86_64.tar.gz`, then
            `tar xzf Kerf-*-linux-x86_64.tar.gz && ./Kerf-*/install.sh` (installs to `~/.local`).

            **Windows (experimental)** — download `Kerf-*-windows-x86_64.zip`, unzip, run `kerf.exe`.
            Not code-signed: SmartScreen may warn → **More info → Run anyway**.

            Linux and Windows builds pass the full automated test suite but have not been
            visually checked yet — please report anything that looks off.
