name: Release

# Push a tag like v0.2.0 (matching Cargo.toml's version) to build and publish binaries.
# Run manually (workflow_dispatch) to build the app as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS universal (arm64 + x86_64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v${version}"; exit 1; }

      - name: Tests
        run: cargo test

      - name: Build Kerf.app (universal)
        run: scripts/bundle-macos.sh universal

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 Kerf-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerf-macos-universal
          path: |
            dist/Kerf-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kerf-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install
            1. Download **Kerf-*-macos-universal.zip**, unzip, move **Kerf.app** to Applications.
            2. The app is ad-hoc signed (not notarized). First launch: right-click → **Open**, or run
               `xattr -dr com.apple.quarantine /Applications/Kerf.app`
            3. Optional CLI: `ln -sf /Applications/Kerf.app/Contents/MacOS/kerf /usr/local/bin/kerf`
